name: Deploy PySpark Docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pdoc pyspark delta-spark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build HTML documentation
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from unittest.mock import MagicMock
          import pyspark.sql, datetime, os, builtins

          # 1. SparkSession mock
          pyspark.sql.SparkSession.builder = MagicMock()

          # 2. datetime.strptime mock
          class FakeDateTime(datetime.datetime):
              @classmethod
              def strptime(cls, date_string, format):
                  return datetime.datetime(2026, 1, 1)
          datetime.datetime = FakeDateTime

          # 3. /app lanti folder creation & log file writing mock
          orig_makedirs = os.makedirs
          def safe_makedirs(name, *args, **kwargs):
              if str(name).startswith('/app'):
                  return
              return orig_makedirs(name, *args, **kwargs)
          os.makedirs = safe_makedirs

          orig_open = builtins.open
          def safe_open(file, mode='r', *args, **kwargs):
              if str(file).startswith('/app') and any(m in mode for m in ('w', 'a', 'x')):
                  return MagicMock()
              return orig_open(file, mode, *args, **kwargs)
          builtins.open = safe_open

          from pdoc.__main__ import cli
          cli()
          " ./Scripts ./common -o ./_site



      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
