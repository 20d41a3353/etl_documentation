name: Deploy PySpark Docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pdoc pyspark delta-spark
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Install dependencies
        run: |
          pip install pdoc pyspark delta-spark confluent-kafka
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi




















      - name: Build HTML documentation
        env:
          PYTHONPATH: .
        run: |
          python -c "
          from unittest.mock import MagicMock
          import pyspark, pyspark.sql, datetime, os, sys, builtins, py4j.java_gateway

          # 1. Hybrid Date+Int object & FakeRow (supports both row[0] and row['COL_NAME'])
          class DateAndInt(datetime.date):
              def __int__(self):
                  return 1

          sample_val = DateAndInt(2026, 1, 1)

          class FakeRow(list):
              def __getitem__(self, key):
                  if isinstance(key, str):
                      return sample_val
                  return super().__getitem__(key)
              def __getattr__(self, name):
                  return sample_val

          fake_row = FakeRow([sample_val])

          class SmartSparkMock(MagicMock):
              def _get_child_mock(self, **kw):
                  m = super()._get_child_mock(**kw)
                  name = kw.get('name', '')
                  if name == 'collect':
                      m.return_value = [fake_row]
                  elif name in ('first', 'head'):
                      m.return_value = fake_row
                  return m

          pyspark.sql.SparkSession.builder = SmartSparkMock()
          pyspark.SparkContext._active_spark_context = SmartSparkMock()
          pyspark.SparkContext._jvm = SmartSparkMock()
          py4j.java_gateway.java_import = MagicMock()

          # 2. datetime.strptime mock
          class FakeDateTime(datetime.datetime):
              @classmethod
              def strptime(cls, date_string, format):
                  return datetime.datetime(2026, 1, 1)
          datetime.datetime = FakeDateTime

          # 3. /app folder creation & log file writing mock
          orig_makedirs = os.makedirs
          def safe_makedirs(name, *args, **kwargs):
              if str(name).startswith('/app'):
                  return
              return orig_makedirs(name, *args, **kwargs)
          os.makedirs = safe_makedirs

          orig_open = builtins.open
          def safe_open(file, mode='r', *args, **kwargs):
              if str(file).startswith('/app') and any(m in mode for m in ('w', 'a', 'x')):
                  return MagicMock()
              return orig_open(file, mode, *args, **kwargs)
          builtins.open = safe_open

          # 4. Script sys.argv, sys.exit & exit() mock
          import pdoc.__main__, argparse
          orig_parse = argparse.ArgumentParser.parse_args
          def custom_parse(self, args=None, namespace=None):
              res = orig_parse(self, args, namespace)
              sys.argv = ['script.py', '1', '2026-01-01', '1', '1', '1', '1']
              sys.exit = MagicMock()
              builtins.exit = MagicMock()
              builtins.quit = MagicMock()
              return res
          argparse.ArgumentParser.parse_args = custom_parse

          pdoc.__main__.cli()
          " ./Scripts ./common -o ./_site





















      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
